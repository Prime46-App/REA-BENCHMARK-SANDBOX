name: REA 6.5.0 isolated fixture benchmark
on:
  workflow_dispatch:
permissions: {}
jobs:
  benchmark:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Build publicly, analyze offline, retain evidence in logs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PREPARE'
          import base64,hashlib,json,pathlib,gzip
          payload={"Dockerfile":"","harness.mjs":"","dependency-package.json":"H4sIAAAAAAACA6tWKijKLEssSVWyUigpKk3VUVBKSS1IzUtJzUvOTC0GilYrFaUm6iamp+aVgLhKZnqmegZKtbUACdXgkToAAAA=","dependency-package-lock.json":"","fixture/app.js":"","baseline/app.js":"","fixture/package.json":"H4sIAAAAAAACAx2LQQqAIBAA770i9pxi135juaCUq6xrENHfWzwOM/MC+YywQe5cYyLD6M2OdMTs+YQFKqfbixbCHRe4kVsqpMNqnXUayFPHX0K/ULkdnKo02F4QbKKKSsDZmEHfN/2WJARCcwAAAA==","baseline/package.json":"H4sIAAAAAAACAx2LQQqAIBAA770i9pxi135juaCUq6xrENHfWzwOM/MC+YywQe5cYyLD6M2OdMTs+YQFKqfbixbCHRe4kVsqpMNqnXUayFPHX0K/ULkdnKo02F4QbKKKSsDZmEHfN/2WJARCcwAAAA==","baseline/app.test.js":""}
          root=pathlib.Path('benchmark-context');root.mkdir()
          for name,data in payload.items():
           p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(gzip.decompress(base64.b64decode(data)))
          assert hashlib.sha256((root/'fixture/app.js').read_bytes()).hexdigest()=='da2f3d878aa8467ff6352ab7e3eb24b492d6b22e106a053518f62e74e60dcbd4'
          lock=json.loads((root/'dependency-package-lock.json').read_text())
          assert lock['packages']['node_modules/rea-agents']['version']=='6.5.0'
          assert lock['packages']['node_modules/rea-agents']['integrity']=='sha512-C6BG7LyrAdR74mSjertM6PrxJkcNZ2bfQNOJornPo9erDEp2tyPRVYPnV5Yodr+1RqewCQla68WulXlVnveD+A=='
          PREPARE
          mkdir -m 0777 results
          docker version > results/docker-version.txt 2>&1
          docker build --no-cache --tag rea-benchmark:6.5.0 benchmark-context
          docker image inspect rea-benchmark:6.5.0 --format '{{.Id}}' > results/image-id.txt
          trap 'docker rm -f rea-fixture-benchmark >/dev/null 2>&1 || true' EXIT
          set +e
          timeout --signal=TERM --kill-after=10s 120s docker run --name rea-fixture-benchmark   --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges:true   --user=1000:1000 --pids-limit=128 --memory=2g --cpus=2 --ulimit=nofile=512:512   --tmpfs=/tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777   --mount="type=bind,src=$(pwd)/results,dst=/evidence"   --env=HOME=/tmp/rea-home --env=TMPDIR=/tmp --env=XDG_CONFIG_HOME=/tmp/config   --env=XDG_CACHE_HOME=/tmp/cache --env=NO_COLOR=1   rea-benchmark:6.5.0 > results/container.stdout 2> results/container.stderr
          run_exit=$?
          set -e
          printf '%s\n' "$run_exit" > results/docker-run-exit.txt
          docker inspect rea-fixture-benchmark --format '{{json .HostConfig}}' > results/docker-hostconfig.json 2>/dev/null || true
          python3 - <<'EXPORT'
          import base64,hashlib,json,pathlib,math
          for p in sorted(pathlib.Path('results').iterdir()):
           if not p.is_file():continue
           data=p.read_bytes();parts=max(1,math.ceil(len(data)/18000));h=hashlib.sha256(data).hexdigest()
           for i in range(parts):
            print('REA_EVIDENCE '+json.dumps({'name':p.name,'part':i,'parts':parts,'sha256':h,'base64':base64.b64encode(data[i*18000:(i+1)*18000]).decode()},separators=(',',':')))
          EXPORT
          exit "$run_exit"
